
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Treasure Hunt Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: 'Trebuchet MS', sans-serif;
    background: linear-gradient(135deg, #102b35, #174b50, #28665b);
    color: white;
    text-align: center;
    min-height: 100vh;
    padding: 25px 15px;
}

h1 {
    color: #ffd76a;
    font-size: 35px;
    text-shadow: 2px 3px #573b17;
}

.subtitle {
    color: #e5e5d0;
    margin-bottom: 25px;
}

.status {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px;
    font-size: 20px;
    font-weight: bold;
}

#lives {
    color: #ff7777;
}

.game-board {
    display: grid;
    grid-template-columns: repeat(3, 110px);
    justify-content: center;
    gap: 20px;
    margin: 35px auto;
}

.chest {
    background: #9a5b25;
    border: 4px solid #e9b65d;
    border-radius: 15px;
    height: 105px;
    width: 110px;
    font-size: 45px;
    cursor: pointer;
    box-shadow: 0 6px #56351b;
    transition: 0.2s;
}

.chest:hover:not(:disabled) {
    transform: translateY(-6px);
    background: #bd7936;
}

.chest:disabled {
    cursor: default;
    opacity: 0.55;
}

.chest.done {
    background: #397b50;
    border-color: #a5e6a7;
}

.question-box {
    display: none;
    background: #fff8e8;
    color: #392c1c;
    max-width: 500px;
    margin: 20px auto;
    padding: 25px;
    border-radius: 20px;
    border: 5px solid #e6b85c;
    box-shadow: 0 8px 20px #0005;
}

.question-box h2 {
    color: #89551f;
}

.option {
    display: block;
    width: 100%;
    padding: 13px;
    margin: 12px 0;
    border: 2px solid #c99a51;
    border-radius: 12px;
    background: #fff0cf;
    color: #392c1c;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.option:hover {
    background: #f4d18c;
}

#feedback {
    font-weight: bold;
    margin-top: 15px;
    min-height: 25px;
}

#nextBtn, #restartBtn {
    display: none;
    background: #28764c;
    color: white;
    padding: 12px 25px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}

#nextBtn:hover, #restartBtn:hover {
    background: #175334;
}

#result {
    font-size: 22px;
    font-weight: bold;
    margin: 25px;
}

.instructions {
    color: #f4e6bc;
    font-size: 14px;
    margin-top: 30px;
}

@media(max-width: 400px) {
    .game-board {
        grid-template-columns: repeat(3, 90px);
        gap: 12px;
    }

    .chest {
        width: 90px;
        height: 90px;
        font-size: 38px;
    }
}
</style>
</head>

<body>

<h1>🏴‍☠️ TREASURE HUNT 🏴‍☠️</h1>

<p class="subtitle">
Temukan harta karun dengan menjawab semua pertanyaan!
</p>

<div class="status">
    <div id="lives">❤️ Nyawa: 2</div>
    <div id="progress">🗝️ 0 / 6</div>
</div>

<div class="game-board" id="board"></div>

<div class="question-box" id="questionBox">
    <h2>💎 Treasure Question</h2>
    <p id="question"></p>

    <div id="options"></div>

    <p id="feedback"></p>

    <button id="nextBtn" onclick="nextQuestion()">
        Buka Harta Berikutnya ➜
    </button>
</div>

<div id="result"></div>

<button id="restartBtn" onclick="restartGame()">
    🔄 Main Lagi
</button>

<p class="instructions">
    Klik kotak harta karun untuk menemukan pertanyaan.<br>
    Jawab dengan benar agar bisa melanjutkan petualangan!
</p>

<script>

const questions = [
    {
        q: "Apa ibu kota Indonesia?",
        a: ["Jakarta", "Bandung", "Surabaya"],
        correct: 0
    },
    {
        q: "Planet yang dikenal sebagai Planet Merah adalah?",
        a: ["Venus", "Mars", "Jupiter"],
        correct: 1
    },
    {
        q: "Hasil dari 8 x 7 adalah?",
        a: ["54", "56", "64"],
        correct: 1
    },
    {
        q: "Organ tubuh yang berfungsi memompa darah adalah?",
        a: ["Paru-paru", "Hati", "Jantung"],
        correct: 2
    },
    {
        q: "Hewan yang mengalami metamorfosis sempurna adalah?",
        a: ["Kupu-kupu", "Kucing", "Ayam"],
        correct: 0
    },
    {
        q: "Apa nama proses tumbuhan membuat makanan sendiri?",
        a: ["Respirasi", "Fotosintesis", "Evaporasi"],
        correct: 1
    }
];

let lives = 2;
let current = 0;
let answered = false;
let gameOver = false;

const board = document.getElementById("board");
const questionBox = document.getElementById("questionBox");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");

function createBoard() {
    board.innerHTML = "";

    questions.forEach((item, index) => {
        const chest = document.createElement("button");

        chest.className = "chest";
        chest.innerHTML = "🎁";
        chest.id = "chest" + index;
        chest.onclick = () => openChest(index);

        if (index < current) {
            chest.classList.add("done");
            chest.innerHTML = "💎";
            chest.disabled = true;
        }

        if (index !== current) {
            chest.disabled = true;
        }

        board.appendChild(chest);
    });
}

function updateStatus() {
    document.getElementById("lives").innerHTML =
        "❤️ Nyawa: " + lives;

    document.getElementById("progress").innerHTML =
        "🗝️ " + current + " / " + questions.length;
}

function openChest(index) {
    if (gameOver || index !== current) return;

    questionBox.style.display = "block";

    document.getElementById("question").innerHTML =
        (index + 1) + ". " + questions[index].q;

    const options = document.getElementById("options");
    options.innerHTML = "";

    feedback.innerHTML = "";
    nextBtn.style.display = "none";
    answered = false;

    questions[index].a.forEach((answer, i) => {
        const btn = document.createElement("button");

        btn.className = "option";
        btn.innerHTML = String.fromCharCode(65 + i) +
            ". " + answer;

        btn.onclick = () => checkAnswer(i);

        options.appendChild(btn);
    });

    document.getElementById("chest" + index).innerHTML = "📦";

    questionBox.scrollIntoView({
        behavior: "smooth",
        block: "center"
    });
}

function checkAnswer(choice) {
    if (answered || gameOver) return;

    const correct = questions[current].correct;
    const buttons = document.querySelectorAll(".option");

    if (choice === correct) {
        answered = true;

        feedback.style.color = "green";
        feedback.innerHTML =
            "🎉 BENAR! Kamu menemukan harta karun!";

        buttons.forEach(btn => btn.disabled = true);

        nextBtn.style.display = "inline-block";

        document.getElementById("chest" + current)
            .classList.add("done");

        document.getElementById("chest" + current)
            .innerHTML = "💎";

    } else {
        lives--;
        updateStatus();

        feedback.style.color = "red";
        feedback.innerHTML =
            "❌ Jawaban salah! Nyawamu berkurang 1.";

        if (lives <= 0) {
            endGame(false);
            return;
        }

        // Pilihan yang sudah salah tidak bisa dipilih lagi.
        buttons[choice].disabled = true;
        buttons[choice].style.opacity = "0.4";
    }
}

function nextQuestion() {
    current++;

    questionBox.style.display = "none";

    if (current >= questions.length) {
        endGame(true);
        return;
    }

    createBoard();
    updateStatus();
}

function endGame(win) {
    gameOver = true;
    questionBox.style.display = "none";
    board.style.display = "none";

    const result = document.getElementById("result");

    if (win) {
        result.innerHTML =
            "🏆 SELAMAT! 🏆<br>" +
            "Kamu berhasil menemukan semua harta karun! 💎";
    } else {
        result.innerHTML =
            "💀 GAME OVER!<br>" +
            "Nyawamu habis. Coba petualangan lagi!";
    }

    document.getElementById("restartBtn").style.display =
        "inline-block";
}

function restartGame() {
    lives = 2;
    current = 0;
    answered = false;
    gameOver = false;

    board.style.display = "grid";
    document.getElementById("result").innerHTML = "";

    document.getElementById("restartBtn").style.display =
        "none";

    questionBox.style.display = "none";

    createBoard();
    updateStatus();
}

createBoard();
updateStatus();

</script>

</body>
</html>
